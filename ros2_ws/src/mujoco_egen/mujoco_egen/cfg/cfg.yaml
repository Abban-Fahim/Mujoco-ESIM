

# mujoco_model_xml: "src/mujoco_egen/mujoco_egen/kuka/full_kuka_INRC3_mounted_camera_usb.xml" 
# mujoco_model_xml: "src/mujoco_egen/mujoco_egen/kuka/full_kuka_INRC3_mounted_camera_vga.xml" 
# mujoco_model_xml: "src/mujoco_egen/mujoco_egen/kuka/full_kuka_INRC3_mounted_camera_ethernet.xml" 
# mujoco_model_xml: "src/mujoco_egen/mujoco_egen/kuka/full_kuka_INRC3_mounted_camera_hdmi.xml" 
mujoco_model_xml: "src/mujoco_egen/mujoco_egen/kuka/full_kuka_INRC3_mounted_camera_hole.xml" 


operations:
  capture_events_enable: False
  save_events: False
  capture_frames_enable: False
  save_frames: False
  save_pose: False
  save_path: "dataset" # absolute path


saccade: 
  pose_is_cartesian: False # False - joint pose [deg], True - cartesian pose [m, deg]
  start_pose: [-90,0,0,90,0,-90,0]
  type: "circle" # circle; random_circle
  duration: 0.5 # simulation seconds


esim: # event simulator parameter
  Cp: 0.9 # positice contrast threshold
  Cn: 0.9 # negative contrast threshold
  refractory_period: 100 # ns

motion_controller: # PD impedance controller is used
  stiffness: [1000.0, 1000.0, 1000.0, 1000.3, 1000.3, 1000.3]
  damping: [50.0, 50.0, 50.0, 50.3, 50.3, 50.3]
