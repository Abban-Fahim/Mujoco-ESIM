mujoco_model_xml: "src/mujoco_egen/mujoco_egen/kuka/full_kuka_INRC3_mounted_camera_hole.xml" 


operations:
  capture_events_enable: True
  save_events: True
  capture_frames_enable: True
  save_frames: True
  save_pose: True
  save_path: "/home/palinauskas/Documents/fortiss_repo/mujoco-eleanor/dataset" # absolute path


saccade: 
  pose_is_cartesian: False # False - joint pose [deg], True - cartesian pose [m, deg]
  start_pose: [-90,-50,0,90,0,-38,-90] # 7th joint should be kept in -90 degrees for initialization
  type: "circle" # circle; random_circle
  duration: 0.5 # simulation seconds


esim: # event simulator parameter
  Cp: 0.9 # positice contrast threshold
  Cn: 0.9 # negative contrast threshold
  refractory_period: 100 # ns

motion_controller: # PD impedance controller is used
  stiffness: [1000.0, 1000.0, 1000.0, 1000.3, 1000.3, 1000.3]
  damping: [50.0, 50.0, 50.0, 50.3, 50.3, 50.3]
  null_space_damping: 10
  null_space_stiffness: 1.0
